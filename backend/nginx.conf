# ============ beeappd.site ============
server {
    listen 80;
    server_name beeappd.site www.beeappd.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beeappd.site www.beeappd.site;

    ssl_certificate     /etc/nginx/cert/beeappd.site_nginx/beeappd.site_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/beeappd.site_nginx/beeappd.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, token, is-dev" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html/bee;
        try_files $uri $uri/ /index.html;
    }
}

# ============ sparkapp.site ============
server {
    listen 80;
    server_name sparkapp.site www.sparkapp.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sparkapp.site www.sparkapp.site;

    ssl_certificate     /etc/nginx/cert/sparkapp.site_nginx/sparkapp.site_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/sparkapp.site_nginx/sparkapp.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, token, is-dev" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html/spark;
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

