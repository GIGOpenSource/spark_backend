upstream backend_pool {
    server buildmart_backend:8000;
}

server {
    listen 80;
    server_name _;

    # ============ API 代理 ============
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ============ WebSocket ============
    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = /api/schema/ {
        proxy_pass http://backend_pool/api/schema/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ 管理后台静态资源 /assets/ ============
    location /assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============ 管理后台 / ============
    location = / {
        alias /usr/share/nginx/html/admin/index.html;
    }

    # ============ SPA fallback（非 api/ws/bee/matchup/spark 的路径统一返回 admin） ============
    location / {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
    }

    # ============ bee 移动端 /bee/ ============
    location /bee/ {
        alias /usr/share/nginx/html/bee/;
        try_files $uri $uri/ /bee/index.html;
        index index.html;
    }

    # ============ matchup 移动端 /matchup/ ============
    location /matchup/ {
        alias /usr/share/nginx/html/matchup/;
        try_files $uri $uri/ /matchup/index.html;
        index index.html;
    }

    # ============ spark 移动端 /spark/ ============
    location /spark/ {
        alias /usr/share/nginx/html/spark/;
        try_files $uri $uri/ /spark/index.html;
        index index.html;
    }
}
